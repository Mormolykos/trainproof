name: CI

# `workflow_call` matters: release.yml invokes this file rather than repeating
# its steps, so there is exactly one definition of "the gate" and a release can
# never run a weaker one than a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `ci.py attribution` reads the last 20 commit messages; the default
          # shallow clone of depth 1 would silently scan one commit and pass.
          fetch-depth: 25
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan the tracked tree and recent commits
        run: python scripts/ci.py attribution

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned on purpose. An unpinned linter turns a green repository red on a
      # morning when nobody changed anything, and the fix is then indexed to a
      # date rather than to a commit. Bumping this is a pull request.
      - name: Install ruff
        run: pip install "ruff==0.16.1"
      - name: Lint
        run: ruff check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install "mypy==2.3.1"
      # Settings, and the reason this is not `--strict`, are in pyproject.toml
      # and docs/adr/003.
      - name: Type check
        run: mypy src/trainproof

  test:
    name: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not hide the other seven. Which versions fail is the
      # information a matrix exists to produce.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev extra
        run: pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest -q

  speech:
    name: pytest with the speech extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # v0.18.1 moved numpy, soundfile and ttsproof out of the core install
      # into this extra. `test` above proves the core install is genuinely
      # core: it runs with none of them, and the dataset tests skip. Something
      # then has to actually RUN those tests, or "skipped" quietly becomes
      # "never executed anywhere".
      - name: Install the package with the speech pack
        run: pip install -e ".[dev,speech]"
      - name: Run the test suite
        run: pytest -q
      - name: No test is skipped when every extra is installed
        run: python scripts/ci.py noskips

  contract:
    name: published contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e "."
      # README.md and CONTRACTS.md promise three exit codes to anyone wiring
      # trainproof into their own pipeline. Unit tests cover the functions;
      # this covers the promise, through the console script.
      - name: Exit-code contract
        run: python scripts/ci.py contract
      # trainproof advertises SARIF output for GitHub annotations. The gallery
      # is deliberately broken, so its findings are uploaded as a build
      # artifact and NOT to code scanning: permanent alerts about fixtures that
      # are supposed to fail teach a reviewer to ignore the security tab.
      - name: Emit SARIF over the fault-injection gallery
        run: |
          set +e
          trainproof doctor examples/gallery --sarif trainproof.sarif
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then echo "trainproof could not judge the gallery"; exit 1; fi
          python - <<'PY'
          import json, sys
          report = json.load(open("trainproof.sarif"))
          assert report["version"] == "2.1.0", report["version"]
          run = report["runs"][0]
          assert run["tool"]["driver"]["name"] == "trainproof"
          assert run["results"], "the gallery produced no findings - the fixtures or the rules moved"
          missing = [r for r in run["results"] if not r.get("ruleId")]
          assert not missing, f"{len(missing)} SARIF results carry no ruleId"
          print(f"SARIF OK: {len(run['results'])} results, "
                f"{len({r['ruleId'] for r in run['results']})} distinct rules")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: trainproof-sarif
          path: trainproof.sarif

  package:
    name: build and verify the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install "build==1.5.1" "twine==6.2.0"
      - name: Versions agree
        run: python scripts/ci.py version
      - name: Build sdist and wheel
        run: python -m build
      - name: Metadata is renderable
        run: twine check dist/*
      # The whole point of this job. Everything above tests the source tree;
      # this installs the artifact a user would download, into an interpreter
      # with no source directory on its path, and asks it to work. A module
      # left out of the wheel is invisible until exactly here.
      - name: Install the wheel into a clean environment and smoke it
        run: python scripts/ci.py wheelcheck
      # Advisory, never blocking: between releases the current version IS on
      # PyPI, which is correct, and a gate that is red by design gets ignored.
      # The release workflow runs the same check as a hard gate.
      - name: Is this version still free on PyPI?
        continue-on-error: true
        run: python scripts/ci.py pypi
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
